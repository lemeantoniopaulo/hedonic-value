name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/hedonic-ci"

      - name: Setup R
        id: setup
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install check dependencies
        id: dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::Rcpp, any::RcppArmadillo
          needs: check

      - name: Verify Rcpp interfaces
        id: bindings
        shell: bash
        run: |
          if Rscript .github/scripts/verify-bindings.R > "$RUNNER_TEMP/hedonic-ci/bindings.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          cat "$RUNNER_TEMP/hedonic-ci/bindings.log"
          exit "$result"

      - name: Test CI result handling
        id: gate
        shell: bash
        run: |
          if Rscript .github/scripts/test-check-support.R > "$RUNNER_TEMP/hedonic-ci/gate-tests.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          cat "$RUNNER_TEMP/hedonic-ci/gate-tests.log"
          exit "$result"

      - name: Execute and capture R CMD check
        id: rcheck
        shell: bash
        run: |
          if Rscript .github/scripts/run-check.R > "$RUNNER_TEMP/hedonic-ci/check-console.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          cat "$RUNNER_TEMP/hedonic-ci/check-console.log"
          exit "$result"

      - name: Capture available environment
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hedonic-ci"
          uname -a > "$RUNNER_TEMP/hedonic-ci/runner-environment.txt"
          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e 'sessionInfo()' > "$RUNNER_TEMP/hedonic-ci/available-session-info.txt" 2>&1 || true
          else
            echo "Rscript unavailable after setup failure; see complete job log." >> "$RUNNER_TEMP/hedonic-ci/runner-environment.txt"
          fi

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          MATRIX_OS: ${{ matrix.os }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BINDINGS_OUTCOME: ${{ steps.bindings.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          CHECK_OUTCOME: ${{ steps.rcheck.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/hedonic-ci"
          {
            echo "## R-CMD-check diagnostics"
            echo "Run: $RUN_URL"
            echo "Commit: $RUN_SHA"
            echo "OS: $MATRIX_OS"
            echo "Setup: $SETUP_OUTCOME"
            echo "Dependencies: $DEPENDENCIES_OUTCOME"
            echo "Bindings: $BINDINGS_OUTCOME"
            echo "CI gate tests: $GATE_OUTCOME"
            echo "Check: $CHECK_OUTCOME"
            for name in check-status.txt runner-error.txt bindings.log gate-tests.log check-console.log; do
              file="$RUNNER_TEMP/hedonic-ci/$name"
              if [ -f "$file" ]; then
                echo
                echo "### $name"
                echo '~~~text'
                tail -n 100 "$file"
                echo '~~~'
              fi
            done
          } | tee "$RUNNER_TEMP/hedonic-ci/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-${{ matrix.os }}-${{ matrix.r }}
          path: ${{ runner.temp }}/hedonic-ci/
          if-no-files-found: warn

  collect-diagnostics:
    name: Collect completed job logs
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preserve complete setup, dependency and check logs
        uses: actions/github-script@v7
        with:
          script: |
            const collect = require('./.github/scripts/collect-job-logs.cjs');
            const path = require('node:path');
            await collect({ github, context, core,
              directory: path.join(process.env.RUNNER_TEMP, 'hedonic-completed-jobs') });
      - name: Upload complete job logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-complete-job-logs
          path: ${{ runner.temp }}/hedonic-completed-jobs/
          if-no-files-found: warn
