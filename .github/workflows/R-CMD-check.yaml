name: R-CMD-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::Rcpp, any::RcppArmadillo
          needs: check
      - name: Verify Rcpp generated files
        shell: Rscript {0}
        run: |
          stopifnot(file.exists("src/RcppExports.cpp"), file.exists("R/RcppExports.R"))
          Rcpp::compileAttributes()
          stopifnot(file.exists("src/RcppExports.cpp"), file.exists("R/RcppExports.R"))
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-diagnostics
          path: |
            check
            *.Rcheck
            **/00check.log
            **/00install.out
          if-no-files-found: ignore
