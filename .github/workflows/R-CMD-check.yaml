name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Install check dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::rmarkdown
          needs: check
      - name: Execute and capture R CMD check
        id: rcheck
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          if Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "never", check_dir = "ci-diagnostics", build_args = "--no-manual")' > ci-diagnostics/rcmdcheck-console.log 2>&1; then
            result=0
          else
            result=$?
          fi
          cat ci-diagnostics/rcmdcheck-console.log
          if [ "$result" -ne 0 ]; then
            echo "R check runner failed (exit $result)"
            exit "$result"
          fi
          log=$(find ci-diagnostics -type f -name 00check.log -print -quit)
          if [ -z "$log" ]; then
            echo "::error::R CMD check log missing"
            exit 1
          fi
          cat "$log"
          status=$(grep -E '^Status: ' "$log" | tail -n 1 || true)
          echo "Check status: $status"
          if ! echo "$status" | grep -Eq 'Status: OK|0 ERRORs, 0 WARNINGs, 0 NOTEs'; then
            echo "::error::R CMD check did not pass cleanly: $status"
            exit 1
          fi
      - name: Publish diagnostic summary
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          CHECK_OUTCOME: ${{ steps.rcheck.outcome }}
        run: |
          mkdir -p ci-diagnostics
          {
            echo "## R-CMD-check — E0 diagnostic"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Commit: \`$RUN_SHA\`"
            echo
            echo "Check step outcome: **$CHECK_OUTCOME**"
            echo
            echo "### Check log"
            log=$(find ci-diagnostics -type f -name 00check.log -print -quit)
            echo '~~~text'
            if [ -n "$log" ]; then
              grep -E '^\\*|ERROR|WARNING|NOTE|Status:' "$log" | tail -n 150 || true
            elif [ -f ci-diagnostics/rcmdcheck-console.log ]; then
              tail -n 100 ci-diagnostics/rcmdcheck-console.log
            else
              echo "Check did not start or no logs were produced. Inspect preceding workflow steps."
            fi
            echo '~~~'
          } | tee ci-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-diagnostics-${{ matrix.os }}
          path: ci-diagnostics/
          if-no-files-found: warn
