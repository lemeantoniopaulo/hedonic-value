name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install check dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Execute and capture R CMD check
        id: rcheck
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "never", check_dir = "ci-diagnostics", build_args = "--no-manual")' > ci-diagnostics/rcmdcheck-console.log 2>&1
          result=$?
          cat ci-diagnostics/rcmdcheck-console.log
          if [ "$result" -ne 0 ]; then
            echo "R check runner failed (exit $result)"
            exit "$result"
          fi
          log=$(find ci-diagnostics -type f -name 00check.log -print -quit)
          if [ -z "$log" ]; then
            echo "::error::R CMD check log missing"
            exit 1
          fi
          cat "$log"
          status=$(grep -E '^Status: ' "$log" | tail -n 1 || true)
          echo "Check status: $status"
          if ! echo "$status" | grep -q '0 ERRORs, 0 WARNINGs, 0 NOTEs'; then
            echo "::error::R CMD check did not pass cleanly: $status"
            exit 1
          fi
      - name: Publish diagnostic summary
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          CHECK_OUTCOME: ${{ steps.rcheck.outcome }}
        run: |
          mkdir -p ci-diagnostics
          {
            echo "## R-CMD-check — E0 diagnostic"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Commit: \`$RUN_SHA\`"
            echo
            echo "Check step outcome: **$CHECK_OUTCOME**"
            echo
            echo "### Check log"
            log=$(find ci-diagnostics -type f -name 00check.log -print -quit)
            echo '~~~text'
            if [ -n "$log" ]; then
              grep -E '^\\*|ERROR|WARNING|NOTE|Status:' "$log" | tail -n 150 || true
            elif [ -f ci-diagnostics/rcmdcheck-console.log ]; then
              tail -n 100 ci-diagnostics/rcmdcheck-console.log
            else
              echo "Check did not start or no logs were produced. Inspect preceding workflow steps."
            fi
            echo '~~~'
          } | tee ci-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn
      - name: Open issue for failed push
        if: failure() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f ci-diagnostics/summary.md ]; then
            printf 'R-CMD-check failed: %s\n' "$RUN_URL" > ci-diagnostics/summary.md
          fi
          gh issue create --title "CI E0: failed check ($${RUN_SHA:0:8})" --body-file ci-diagnostics/summary.md ||
            echo "::warning::Issue publication failed. Diagnostic summary and artifact are still available in Actions."
